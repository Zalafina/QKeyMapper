[package]
name = "qkeymapper-mcp-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false

[dependencies]
hmac = "0.13"
rmcp = { version = "=3.10.0", default-features = false, features = ["base64", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
getrandom = "0.4"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
zeroize = "1.8"

[profile.release]
lto = "thin"
strip = "symbols"
