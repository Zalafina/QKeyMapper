[package]
name = "qkeymapper-mcp-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false

[dependencies]
rmcp = { version = "=3.10.0", default-features = false, features = ["base64", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-util = "0.7"

[profile.release]
lto = "thin"
strip = "symbols"
